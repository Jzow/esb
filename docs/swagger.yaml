info:
  contact: {}
  description: ticket service
  license:
    name: MIT
    url: http://175.27.214.248/gitlab-instance-80f356dd/ticket/-/blob/main/LICENSE
  termsOfService: http://175.27.214.248:8888
  title: ticket API
  version: "1.0"
paths:
  /api/ticket/upload:
    post:
      parameters:
      - description: Image File
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Import image
      tags:
      - util
  /api/ticket/v1/create:
    post:
      parameters:
      - description: 创建工单信息
        in: body
        name: params
        required: true
        schema:
          allOf:
          - $ref: '#/definitions/v1.CreateTicketForm'
          - properties:
              field_json:
                allOf:
                - $ref: '#/definitions/gormType.JSONMap'
                - properties:
                    common:
                      type: object
                    product:
                      type: object
                    sub_product:
                      type: object
                  type: object
            type: object
      produces:
      - application/json
      responses:
        "200":
          description: data=ticket_id when success
          schema:
            allOf:
            - $ref: '#/definitions/app.SuccessResponse'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: failure http status
          schema:
            $ref: '#/definitions/app.Response'
      summary: Create ticket
      tags:
      - ticket
  /api/ticket/v1/customFieldConfig:
    get:
      parameters:
      - description: 租户ID
        in: query
        name: tenantId
        required: true
        type: string
      - description: 应用ID
        in: query
        name: projectId
        type: string
      - description: 字段类型(search:搜索字段 list:列表字段)
        in: query
        name: type
        type: string
      - description: 用户ID
        in: query
        name: userId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success http status
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: failure http status
          schema:
            $ref: '#/definitions/app.Response'
      summary: Get multiple customFieldConfigs
      tags:
      - customFieldConfig
    post:
      parameters:
      - description: 添加用户搜索配置
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/v1.AddTicketCustomFieldConfigForm'
      produces:
      - application/json
      responses:
        "200":
          description: success http status
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: failure http status
          schema:
            $ref: '#/definitions/app.Response'
      summary: Add customFieldConfig
      tags:
      - customFieldConfig
  /api/ticket/v1/customFieldConfig/{id}:
    delete:
      parameters:
      - description: config_id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success http status
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: failure http status
          schema:
            $ref: '#/definitions/app.Response'
      summary: Delete customFieldConfig
      tags:
      - customFieldConfig
    get:
      parameters:
      - description: config_id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success http status
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: failure http status
          schema:
            $ref: '#/definitions/app.Response'
      summary: Get a single customFieldConfig
      tags:
      - customFieldConfig
    put:
      parameters:
      - description: config_id
        in: path
        name: id
        required: true
        type: string
      - description: 更新用户搜索配置
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/v1.EditTicketCustomFieldConfigForm'
      produces:
      - application/json
      responses:
        "200":
          description: success http status
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: failure http status
          schema:
            $ref: '#/definitions/app.Response'
      summary: Update customFieldConfig
      tags:
      - customFieldConfig
  /api/ticket/v1/detail/{id}:
    get:
      parameters:
      - default: 14995717898715136
        description: 工单ID
        in: path
        name: id
        required: true
        type: integer
      - default: a104c2b52ee611ef965708c0eb4e5df7

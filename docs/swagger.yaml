basePath: /
definitions:
  LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        type: string
    required:
    - username
    - password
    type: object
  LoginResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        properties:
          expires_in:
            example: 7200
            type: integer
          token:
            type: string
          token_type:
            example: Bearer
            type: string
          username:
            example: admin
            type: string
        type: object
      msg:
        example: ok
        type: string
    type: object
  ProxyBody:
    additionalProperties: true
    type: object
  Response:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      msg:
        example: ok
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: ESB 对外提供用户登录、退出登录和 /api/esb/v1/{第三方完整URL} 通用代理接口。APP TOKEN 使用 X-API-Token，直接填写 token 原值，不要加 Bearer。
  title: ESB OpenAPI 通用代理服务
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 使用账号密码换取 ESB 用户登录 token。用户 token 存储在 Redis，默认 2 小时有效。agent 或系统对系统调用建议使用 X-API-Token APP TOKEN。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: 账号或密码错误
          schema:
            $ref: '#/definitions/Response'
      summary: 用户登录
      tags:
      - 服务认证
  /api/auth/logout:
    post:
      description: 删除 Redis 中的用户登录 token。APP TOKEN 是配置文件中的静态令牌，不受退出登录影响。
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: token 无效或已过期
          schema:
            $ref: '#/definitions/Response'
      security:
      - UserBearerAuth: []
      summary: 退出登录
      tags:
      - 服务认证
  /api/esb/v1/{url}:
    delete:
      description: 使用 X-API-Token 调用。APP TOKEN 是普通应用令牌，不要加 Bearer。
      parameters:
      - description: 第三方完整 URL，包含 https://、域名、路径和查询参数。
        in: path
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 转发成功
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: APP TOKEN 缺失、错误或无应用权限
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: 第三方接口返回异常或 ESB 转发失败
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiTokenAuth: []
      summary: DELETE 转发第三方完整 URL
      tags:
      - OpenAPI 通用代理
    get:
      description: 把第三方完整 URL 放在 /api/esb/v1/ 后面，例如 /api/esb/v1/https://gaiaopenapi-s.copm.com.cn/atd-webapi/api/v1/workflow/apply/list。APP TOKEN 使用 X-API-Token，且不要加 Bearer。Swagger 对完整 URL 路径参数支持有限，实际联调建议使用 Apifox、Postman 或 curl。
      parameters:
      - description: 第三方完整 URL，包含 https://、域名、路径和查询参数。Swagger 展示为 {url}，实际路由会接收后面的完整路径。
        in: path
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 转发成功
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: APP TOKEN 缺失、错误或无应用权限
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: 第三方接口返回异常或 ESB 转发失败
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiTokenAuth: []
      summary: GET 转发第三方完整 URL
      tags:
      - OpenAPI 通用代理
    post:
      consumes:
      - application/json
      description: 把请求方法、query 和 JSON body 原样转发给第三方。ESB 会自动处理第三方 OAuth token、固定请求头和响应包装。
      parameters:
      - description: 第三方完整 URL，包含 https://、域名、路径和查询参数。
        in: path
        name: url
        required: true
        type: string
      - description: 需要转发给第三方的 JSON 请求体
        in: body
        name: body
        schema:
          $ref: '#/definitions/ProxyBody'
      produces:
      - application/json
      responses:
        "200":
          description: 转发成功
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: APP TOKEN 缺失、错误或无应用权限
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: 第三方接口返回异常或 ESB 转发失败
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiTokenAuth: []
      summary: POST 转发第三方完整 URL
      tags:
      - OpenAPI 通用代理
    put:
      consumes:
      - application/json
      description: 使用 X-API-Token 调用。APP TOKEN 是普通应用令牌，不要加 Bearer。
      parameters:
      - description: 第三方完整 URL，包含 https://、域名、路径和查询参数。
        in: path
        name: url
        required: true
        type: string
      - description: 需要转发给第三方的 JSON 请求体
        in: body
        name: body
        schema:
          $ref: '#/definitions/ProxyBody'
      produces:
      - application/json
      responses:
        "200":
          description: 转发成功
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: APP TOKEN 缺失、错误或无应用权限
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: 第三方接口返回异常或 ESB 转发失败
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiTokenAuth: []
      summary: PUT 转发第三方完整 URL
      tags:
      - OpenAPI 通用代理
schemes:
- http
securityDefinitions:
  ApiTokenAuth:
    description: ESB APP TOKEN，直接填写 token 原值，不要加 Bearer。
    in: header
    name: X-API-Token
    type: apiKey
  UserBearerAuth:
    description: 用户登录 token，格式：Bearer <user-token>。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
